when:
  - event: ["manual"]

engine: "nixery"

environment:
  TEST_ASSIGNED: $TEST

steps:
  - name: "check TEST_ASSIGNED is set"
    command: "test -n \"$TEST_ASSIGNED\" && echo 'TEST_ASSIGNED is set' || echo 'TEST_ASSIGNED is empty'"
  - name: "length of TEST_ASSIGNED"
    command: "echo -n \"$TEST_ASSIGNED\" | wc -c"
  - name: "echo TEST_ASSIGNED raw"
    command: "echo \"$TEST_ASSIGNED\""
  - name: "echo TEST_ASSIGNED base64"
    command: "echo -n \"$TEST_ASSIGNED\" | base64"
  - name: "check TEST is set"
    command: "test -n \"$TEST\" && echo 'TEST is set' || echo 'TEST is empty'"
  - name: "length of TEST"
    command: "echo -n \"$TEST\" | wc -c"
  - name: "echo TEST raw"
    command: "echo \"$TEST\""
  - name: "echo TEST base64"
    command: "echo -n \"$TEST\" | base64"
